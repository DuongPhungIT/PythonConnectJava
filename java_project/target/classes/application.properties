server.port=8080
logging.level.com.example.calculator=DEBUG
logging.level.io.grpc=DEBUG

# Netty configuration for macOS
io.netty.noPreferDirect=true
io.netty.noUnsafe=true
io.netty.leakDetection.level=disabled

# Disable epoll on macOS
io.grpc.netty.shaded.io.netty.noPreferNative=true
io.grpc.netty.shaded.io.netty.transport.noNative=true
io.grpc.netty.shaded.io.netty.transport.noEpoll=true

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Thymeleaf settings
spring.thymeleaf.cache=false 