      }

        margin-top: 1rem;
      }
    </style>

      <!-- Image Comparison Section -->
      <div class="card">
        <div class="card-body">
          <form
            action="/compare-images"
            method="post"
            th:if="${isSamePerson == null}"
          >
            <div class="mb-3">
              <label for="image1Path" class="form-label"
                >Đường dẫn ảnh 1:</label
              >
              <input
                type="text"
                class="form-control"
                id="image1Path"
                name="image1Path"
                th:value="${image1Path}"
                required
              />
            </div>
            <div class="mb-3">
              <label for="image2Path" class="form-label"
                >Đường dẫn ảnh 2:</label
              >
              <input
                type="text"
                class="form-control"
                id="image2Path"
                name="image2Path"
                th:value="${image2Path}"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">So sánh ảnh</button>
          </form>

          <div th:if="${isSamePerson != null}" class="result">
            Kết quả:
            <span
              style="font-size: 12px; font-style: italic"
              th:text="${isSamePerson ? 'Là của cùng một người' : 'Không phải của cùng một người'}"
            ></span>
            <div class="row" style="margin-top: 20px">
              <div class="col-md-6">
                <div class="card">
                  <div class="card-header">
                    <h6 class="mb-0">Hình 1</h6>
                  </div>
                  <div class="card-body text-center">
                    <img
                      th:src="${image1Path}"
                      class="img-fluid rounded"
                      alt="Image 1"
                      style="max-height: 300px"
                    />
                  </div>
                  <div style="font-size: 12px; padding: 10px">
                    Url:
                    <a
                      href="${image1Path}"
                      target="_blank"
                      th:text="${image1Path}"
                      style="
                        display: inline-block;
                        max-width: 100%;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                        vertical-align: bottom;
                      "
                    ></a>
                  </div>
                </div>
                <div
                  th:text="${image1IsFake ? 'Ảnh 1 là ảnh giả' : 'Ảnh 1 là ảnh thật'}"
                ></div>
              </div>
              <div class="col-md-6">
                <div class="card">
                  <div class="card-header">
                    <h6 class="mb-0">Hình 2</h6>
                  </div>
                  <div class="card-body text-center">
                    <img
                      th:src="${image2Path}"
                      class="img-fluid rounded"
                      alt="Image 2"
                      style="max-height: 300px"
                    />
                  </div>
                  <div style="font-size: 12px; padding: 10px">
                    Url:
                    <a
                      href="${image2Path}"
                      target="_blank"
                      th:text="${image2Path}"
                      style="
                        display: inline-block;
                        max-width: 100%;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                        vertical-align: bottom;
                      "
                    ></a>
                  </div>
                </div>
                <div
                  th:text="${image2IsFake ? 'Ảnh 2 là ảnh giả' : 'Ảnh 2 là ảnh thật'}"
                ></div>
              </div>
            </div>
          </div>
          <div th:if="${error}" class="error" th:text="${error}"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
